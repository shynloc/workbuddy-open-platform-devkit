      - Skill Frontmatter: schemas/skill-frontmatter.schema.json
      - Expert plugin.json: schemas/expert-plugin.schema.json
      - Expert Team plugin.json: schemas/expert-team-plugin.schema.json
      - Connector Meta: schemas/connector-meta.schema.json
      - Token Schema: schemas/token-schema.schema.json
      - Release Manifest: schemas/release-manifest.schema.json

  - DevKit:
      - Freshness Dashboard: _generated/freshness.md
      - Tools & Starters: _generated/devkit-tools.md

  - Real-world Validation:
      - Methodology: 95-validation/methodology.md
      - Ledger: 95-validation/ledger.md
      - V1 Readiness: 95-validation/v1-readiness.md
