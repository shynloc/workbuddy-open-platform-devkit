site_name: WB-OPDK
site_description: WorkBuddy Open Platform Development Kit
site_url: https://shynloc.github.io/workbuddy-open-platform-devkit/
repo_url: https://github.com/shynloc/workbuddy-open-platform-devkit
repo_name: shynloc/workbuddy-open-platform-devkit
hooks:
  - scripts/mkdocs_hooks.py
docs_dir: build/docs
site_dir: build/site

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - meta
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - 首页: README.md
  - Agent 入口: START_HERE.md
  - 开发者入口: DEVELOPER_START.md

  - 平台:
      - Overview: 00-platform/overview.md
      - 入驻: 00-platform/onboarding.md
      - 产品地图: 00-platform/product-map.md
      - 能力决策树: 00-platform/capability-decision-tree.md
      - 术语: 00-platform/terminology.md

  - 资质与类目:
      - Overview: 05-qualification-compliance/README.md
      - 主体与类目决策: 05-qualification-compliance/subject-and-category-decision.md
      - 个人主体: 05-qualification-compliance/individual.md
      - 非个人主体: 05-qualification-compliance/enterprise.md
      - Qualification Gate: 05-qualification-compliance/qualification-gate.md

  - Skill:
      - Specification: 10-skill/specification.md
      - Frontmatter: 10-skill/frontmatter-reference.md
      - Development Workflow: 10-skill/development-workflow.md
      - QA: 10-skill/qa-checklist.md
      - Publishing Checklist: 10-skill/publishing-checklist.md

  - Expert:
      - Specification: 20-expert/specification.md
      - plugin.json Reference: 20-expert/plugin-json-reference.md
      - Category Reference: 20-expert/category-reference.md
      - Design Guide: 20-expert/design-guide.md
      - QA: 20-expert/qa-checklist.md

  - Expert Team:
      - Specification: 30-expert-team/specification.md
      - Orchestration: 30-expert-team/orchestration.md
      - Dependencies: 30-expert-team/dependencies.md
      - Lead Settings Upstream Status: 30-expert-team/settings-json.md
      - QA: 30-expert-team/qa-checklist.md

  - Connector:
      - Specification: 40-connector/specification.md
      - connector-meta.json: 40-connector/connector-meta-reference.md
      - MCP: 40-connector/mcp-guide.md
      - CLI: 40-connector/cli-guide.md
      - Auth: 40-connector/auth-and-credentials.md
      - token-schema.json: 40-connector/token-schema-reference.md
      - Version Compatibility: 40-connector/version-compatibility.md
      - High-risk Tools: 40-connector/high-risk-tools.md
      - QA: 40-connector/qa-checklist.md

  - Buddy App:
