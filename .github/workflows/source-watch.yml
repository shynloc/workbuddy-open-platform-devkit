name: Official Source Watch

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/official-sources.yaml"
      - "sources/source-baseline.json"
      - "scripts/check_official_sources.py"
      - ".github/workflows/source-watch.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official source status
        run: python3 scripts/check_official_sources.py --json > source-status.json

      - name: Compare with committed baseline
        if: ${{ hashFiles('sources/source-baseline.json') != '' }}
        run: |
          python3 scripts/check_official_sources.py             --baseline sources/source-baseline.json             --fail-on-change

      - name: Generate proposed baseline snapshot
        if: always()
        run: |
          python3 scripts/check_official_sources.py             --write-baseline proposed-source-baseline.json

      - name: Upload source-watch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-official-source-status
          path: |
            source-status.json
            proposed-source-baseline.json
