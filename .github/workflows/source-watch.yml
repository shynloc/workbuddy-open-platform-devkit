name: Official Source Watch

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/official-sources.yaml"
      - "sources/source-baseline.json"
      - "sources/source-impact-map.json"
      - "scripts/check_official_sources.py"
      - "scripts/build_source_change_report.py"
      - ".github/workflows/source-watch.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official source status with baseline comparison
        run: |
          python3 scripts/check_official_sources.py             --baseline sources/source-baseline.json             --json > source-status.json

      - name: Build impact-aware change review
        run: |
          python3 scripts/build_source_change_report.py             source-status.json             --impact-map sources/source-impact-map.json             --json-out source-change-report.json             --markdown-out source-change-report.md

      - name: Fail when registered official content changed
        run: |
          python3 scripts/check_official_sources.py             --baseline sources/source-baseline.json             --fail-on-change

      - name: Generate proposed baseline snapshot
        if: always()
        run: |
          python3 scripts/check_official_sources.py             --write-baseline proposed-source-baseline.json

      - name: Upload source-watch review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-official-source-status
          path: |
            source-status.json
            source-change-report.json
            source-change-report.md
            proposed-source-baseline.json
