name: KB CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Validate KB metadata
        run: python3 scripts/validate_kb.py

      - name: Validate JSON Schemas and representative starters
        run: python3 scripts/validate_schemas.py

      - name: Validate real-world validation records
        run: python3 scripts/validate_validation_records.py

      - name: Smoke-test starter templates and scaffolds
        run: python3 scripts/smoke_test_templates.py

      - name: Syntax-check OAuth reference
        run: python3 -m py_compile examples/third-party-oauth-minimal/app.py

      - name: Generate and validate a sample release manifest
        run: |
          python3 scripts/generate_release_manifest.py             90-templates/skill-template             --validation-status pass             --validator scripts/validate_skill.py             --side-effect-review not-applicable             --output /tmp/release-manifest.json
          python3 scripts/validate_json_schema.py             /tmp/release-manifest.json             schemas/release-manifest.schema.json

      - name: Exercise one-command release pipeline
        run: |
          python3 scripts/release_check.py             90-templates/skill-template             --dist /tmp/wb-opdk-release             --side-effect-review not-applicable
          test -s /tmp/wb-opdk-release/your-skill-name-v1.0.0.zip
          test -s /tmp/wb-opdk-release/your-skill-name-v1.0.0.manifest.json

      - name: Prepare HTML knowledge base
        run: python3 scripts/prepare_docs.py

      - name: Install docs dependencies
        run: python3 -m pip install -r requirements-docs.txt

      - name: Build HTML knowledge base
        run: mkdocs build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: wb-opdk-html
          path: build/site