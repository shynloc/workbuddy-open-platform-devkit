name: KB CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate KB metadata
        run: python3 scripts/validate_kb.py

      - name: Install docs dependencies
        run: python3 -m pip install -r requirements-docs.txt

      - name: Build HTML knowledge base
        run: mkdocs build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: wb-opdk-html
          path: ../wb-opdk-site
